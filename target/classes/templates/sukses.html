<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Berhasil</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="success-card">
        <div class="success-icon">✓</div>
        <h1>Pendaftaran Berhasil!</h1>
        <p class="success-subtitle">Pendaftaran berhasil! Terima kasih telah mendaftar.</p>
        <p class="success-note">Terima kasih telah mendaftar.</p>
        <p class="success-info">
            Data pendaftaran Anda sedang dalam proses verifikasi oleh pihak kampus.
            Kami akan menghubungi Anda melalui email yang telah didaftarkan.
        </p>
        <a href="/" class="btn-kembali">Kembali</a>
    </div>
</div>
</body>
</html>
